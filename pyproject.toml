[project]
name = "doc-qa"
version = "0.2.0"
description = "Async document QA pipeline that generates best-practice guidance reports with Google ADK."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pouria Mortezaagha" }]
keywords = ["llm", "document-analysis", "google-adk", "litellm"]
dependencies = [
    "google-adk>=2.7.1",
    "litellm>=1.98.0",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "tqdm>=4.70.0",
    "typer>=0.27.1",
]

[project.scripts]
doc-qa = "doc_qa.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_qa"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF", "PTH", "C4", "ARG", "TID", "PL"]
ignore = ["ANN401", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
# Typer builds its interface from positional parameters with defaults.
"src/doc_qa/cli.py" = ["PLR0917"]
"tests/*" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ARG001", "ARG002", "ARG005", "PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["google.*", "litellm.*", "tqdm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --cov=doc_qa --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["src/doc_qa"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
